services:
  - type: web
    name: oggy-organizer
    env: python
    buildCommand: pip install -r ../requirements.txt
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: mistralai/ministral-8b-2512
