<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "My Oggy Organizer" }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/output.css?v=13">
</head>
<body>
<header class="topbar-lib">
<div class="topbar-inner">
<a href="/" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)" aria-label="My Oggy Organizer home">
<span class="brand-mark"><img src="/static/images/oggy-mascot.webp" alt="Oggy logo"></span>
<span style="font-weight:500;font-size:16px;white-space:nowrap">My Oggy Organizer</span>
</a>
<nav class="topnav" aria-label="Pages">
<a href="/">Library</a>
<a href="/compare">Compare</a>
</nav>
<form class="searchbar" id="lib-search-form" action="/" method="get"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="lib-search" name="q" type="search" placeholder="Ask across all your documents" aria-label="Ask across all your documents"></form>
<button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button class="btn-primary" id="lib-add" type="button">Add files</button>
<input id="lib-file" type="file" hidden multiple accept=".pdf,.pptx,.docx,.html,.htm,.csv,.xlsx,.txt,.md">
</div>
<div class="topbar-inner" id="lib-answer-wrap" hidden style="padding-top:0">
<div class="answer" id="lib-answer" role="status" style="flex:1"></div>
</div>
</header>
<main class="page-lib">
{% block content %}{% endblock %}
</main>
<nav class="tabbar" aria-label="Collections">
<button type="button" data-shelf="all" class="active">All</button>
<button type="button" data-shelf="papers">Papers</button>
<button type="button" data-shelf="slides">Slides</button>
<button type="button" data-shelf="notes">Notes</button>
<button type="button" data-shelf="data">Data</button>
<button type="button" data-shelf="review">Review</button>
</nav>
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<script src="/static/js/app.js?v=19"></script>
</body>
</html>
