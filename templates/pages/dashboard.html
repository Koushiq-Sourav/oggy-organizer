{% extends "layouts/base.html" %}
{% block content %}
<h1 class="page-title" style="margin:0 0 8px">Library</h1>
<div class="lib-grid" id="lib-grid">
<div class="lib-side lib-left" role="navigation" aria-label="Collections">
<div class="shelf-label">Collections</div>
<button class="shelf active" data-shelf="all" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/></svg>All files<span class="count-pill" data-count="all"></span></button>
<button class="shelf" data-shelf="papers" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>Research papers<span class="count-pill" data-count="papers"></span></button>
<button class="shelf" data-shelf="slides" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>Slides<span class="count-pill" data-count="slides"></span></button>
<button class="shelf" data-shelf="notes" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>Notes<span class="count-pill" data-count="notes"></span></button>
<button class="shelf" data-shelf="data" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>Data and sheets<span class="count-pill" data-count="data"></span></button>
<div class="shelf-label" style="margin-top:16px">Smart views</div>
<button class="shelf" data-shelf="review" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Needs review<span class="count-pill" data-count="review"></span></button>
<button class="shelf" data-shelf="related" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>Related groups</button>
</div>
<div class="lib-center">
<div class="dropzone" id="lib-drop" role="button" tabindex="0" aria-label="Drop files here or press Enter to browse">Drop files here. Oggy sorts them.</div>
<div id="lib-uploads" aria-live="polite"></div>
<div id="lib-list" style="display:flex;flex-direction:column;gap:8px" role="listbox" aria-label="Documents" tabindex="0"></div>
<div id="lib-empty" class="card" style="margin-top:8px;font-size:16px;color:var(--text-secondary)">Drop your first paper here<button class="btn-primary" style="margin-left:8px" onclick="document.getElementById('lib-file').click()">Add files</button></div>
</div>
<div class="lib-side lib-right" id="analysis-pane">
<div style="font-weight:500;margin-bottom:8px;font-size:16px">Analysis</div>
<div id="lib-analysis" class="fade-in" style="font-size:16px">
<div class="shelf-label">Summary</div>
<div id="lib-summary" class="font-voice" style="margin-bottom:8px">Select a document to see Oggy analysis.</div>
<div class="shelf-label">Key topics</div>
<div id="lib-tags" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px"></div>
<div class="meta" id="lib-counts"></div>
<div class="shelf-label" style="margin-top:8px">Connected to</div>
<div id="lib-links" style="color:var(--text-secondary);margin-bottom:8px">—</div>
<div style="display:flex;flex-direction:column;gap:8px">
<button class="btn-action" id="lib-reading" type="button">Finding Gaps</button>
</div>
</div>
</div>
</div>
{% endblock %}
